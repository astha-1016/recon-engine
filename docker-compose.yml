# One-command demo:  docker compose up --build   then open http://localhost:8081
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: reconcile
      POSTGRES_USER: reconcile
      POSTGRES_PASSWORD: reconcile
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconcile"]
      interval: 5s
      retries: 10

  ml:
    build: ./ml-service
    ports: ["8000:8000"]
    environment:
      ML_DATA_DIR: /srv/data
    volumes:
      - ./ml-service/data:/srv/data          # training_base.csv.gz in, trained models + feedback out
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      retries: 30
      start_period: 120s                     # first start trains the initial model

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/reconcile
      DB_USER: reconcile
      DB_PASSWORD: reconcile
      ML_URL: http://ml:8000
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-dev-only-secret-0123456789}
      SEED_PASSWORD: ${SEED_PASSWORD:-change-me-now}
      # Set REQUIRE_STRONG_SECRETS=true (in .env) and the backend refuses to start on the placeholder secrets.
      REQUIRE_STRONG_SECRETS: ${REQUIRE_STRONG_SECRETS:-false}
      EVAL_FILE: /app/docs/evaluation.json
      CORS_ORIGINS: http://localhost:8081
    volumes:
      - ./docs:/app/docs:ro
    depends_on:
      db: { condition: service_healthy }
      ml: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["8081:80"]
    depends_on: [backend]

volumes:
  dbdata:
