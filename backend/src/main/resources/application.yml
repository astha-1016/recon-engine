spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reconcile}
    username: ${DB_USER:reconcile}
    password: ${DB_PASSWORD:reconcile}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. "update" stays as a safety net for now; once the app has started cleanly on your
      # database, run with DDL_AUTO=validate so a schema mismatch fails at startup instead of at runtime.
      ddl-auto: ${DDL_AUTO:update}
  flyway:
    enabled: true
    baseline-on-migrate: true   # a database created before Flyway existed is treated as already at V1
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  jwt-secret: ${JWT_SECRET:change-this-secret-it-must-be-at-least-32-bytes}
  ml-url: ${ML_URL:http://localhost:8000}
  ml-enabled: ${ML_ENABLED:true}
  payee-vpa: ${PAYEE_VPA:merchant@examplebank}
  payee-name: ${PAYEE_NAME:Example Merchant}
  evaluation-file: ${EVAL_FILE:docs/evaluation.json}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  seed-password: ${SEED_PASSWORD:change-me-now}
  require-strong-secrets: ${REQUIRE_STRONG_SECRETS:false}

server:
  error:
    include-message: always   # so the forms can show why a request was refused ("Invoice X already exists", ...)

management:
  endpoints:
    web:
      exposure:
        include: health
